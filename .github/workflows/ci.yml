name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Detect configured npm scripts
        id: script-check
        run: |
          node -e "const fs=require('fs');const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));const scripts=pkg.scripts||{};const hasLint=Boolean(scripts.lint);const hasBuild=Boolean(scripts.build);const hasTest=Boolean(scripts.test)&&!/no test specified/i.test(scripts.test);const out=process.env.GITHUB_OUTPUT;fs.appendFileSync(out,`has_lint=${hasLint}\n`);fs.appendFileSync(out,`has_test=${hasTest}\n`);fs.appendFileSync(out,`has_build=${hasBuild}\n`);"

      - name: Run lint
        if: steps.script-check.outputs.has_lint == 'true'
        run: npm run lint

      - name: Skip lint (not configured)
        if: steps.script-check.outputs.has_lint != 'true'
        run: echo "Skipping lint: no 'lint' script found in package.json"

      - name: Run tests
        if: steps.script-check.outputs.has_test == 'true'
        run: npm test

      - name: Skip tests (not configured)
        if: steps.script-check.outputs.has_test != 'true'
        run: echo "Skipping tests: no usable 'test' script found in package.json"

      - name: Run production build
        if: steps.script-check.outputs.has_build == 'true'
        run: npm run build

      - name: Skip production build (not configured)
        if: steps.script-check.outputs.has_build != 'true'
        run: echo "Skipping build: no 'build' script found in package.json"
